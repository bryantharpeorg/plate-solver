# The checks the Ergane merge queue requires, one per gate declared in ergane.yaml.
#
# The job names below ARE the gate names. GitHub names each check run after the
# job's `name`, and the `ergane merge queue` ruleset requires a check named after
# each declared gate. Rename a job here and the factory refuses to dispatch
# against this repo.
#
# These must stay in lockstep with `gates:` in ergane.yaml. A node runs those
# commands inside bwrap on the factory host; this workflow runs the same commands
# on a runner so the merge queue has a check to require. Two places, one contract:
# if they drift, a node can pass locally and be refused at the queue, or the
# reverse.
#
# One part of the contract is kept by another workflow, since 2026-11-14: the
# finder-page half of the local `test` gate (`npm ci` through Playwright) is not
# repeated here. ci.yml's `finder-page` job runs those same commands on every pull
# request and merge group and is a required check itself, so running them in this
# job too only made the slowest check five minutes slower (315 s of a 23-minute
# `test` on 2026-11-14). Local `test` = `test` here plus `finder-page` there.
#
# ci.yml stays the full verification (its 13 jobs are required by branch
# protection and also run on `merge_group`). Same supply-chain rules as ci.yml:
# actions pinned by commit SHA, least-privilege token, --locked everywhere.
name: ergane gates

on:
  pull_request:
  merge_group:
  # Also on main, for the build cache. A cache saved by a pull request or a merge
  # group can be read only by that same ref, so with no run on main every run of
  # these jobs compiled the whole dependency graph from nothing (2 min 08 s of
  # `test` on 2026-11-14, and a dozen unreadable 500 MB caches a day). The runs on
  # main save the cache; every other run only reads it.
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ergane-gates-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # cargo-nextest, pinned by version and by the checksum of its release archive, as
  # ci.yml pins its tools. The factory host carries the same version in its own
  # toolchain (ergane.yaml, under `caches:`); change the two together.
  CARGO_NEXTEST_VERSION: "0.9.152"
  CARGO_NEXTEST_SHA256: "d039b43c3e0958441b6ad0a39c8884d018b3d2e8fb9928f209074b1100b5e17a"

jobs:
  lint:
    name: "lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with: { components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with: { save-if: "${{ github.ref == 'refs/heads/main' }}" }
      - name: "lint"
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --all-features --locked
          RUSTDOCFLAGS="-D warnings" cargo doc -p finder --no-deps

  test:
    name: "test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with: { save-if: "${{ github.ref == 'refs/heads/main' }}" }
      - name: Install cargo-nextest
        run: |
          archive="cargo-nextest-${CARGO_NEXTEST_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -LsSf -o "$RUNNER_TEMP/$archive" \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-${CARGO_NEXTEST_VERSION}/$archive"
          echo "${CARGO_NEXTEST_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "${CARGO_HOME:-$HOME/.cargo}/bin"
          cargo nextest --version
      # The cargo half of ergane.yaml's `test` gate, command for command. Its
      # finder-page half is ci.yml's `finder-page` job (see the top of this file).
      - name: "test"
        run: |
          cargo nextest run --workspace --all-targets --all-features --locked
          cargo test --workspace --locked --doc
