# Tier-2 verification — FAST gates for plate-solver.
#
# GATED ON BUILDABLE CODE: main starts spec-only (the specs-only rewrite). The `detect` job
# checks for a root Cargo.toml; every cargo job skips cleanly until the first
# crate lands (GitHub treats skipped required checks as satisfied), so branch
# protection can require all jobs TODAY and the gates arm themselves the moment
# code exists. The secret scan always runs — specs can leak secrets too.
#
# Supply-chain hardening: actions pinned by commit SHA, least-privilege token,
# pinned tool versions, --locked everywhere.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    # `labeled`/`unlabeled` are NOT in the default set ([opened, synchronize,
    # reopened]), and the `hold` job is useless without them: applying
    # `hold:human` would not re-run CI, so the required check would sit GREEN and
    # the brake would not brake.
    #
    # Found the hard way on the first real hold (PR #27): the label went on and
    # nothing turned red.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # The Ergane merge queue builds each queued PR on a temporary branch and waits for
  # every required check to report there. Branch protection requires 12 of the jobs
  # below, all but quality-report and test-coverage, so without this trigger none of
  # them would run on the queued commit and every queued PR would wait out the queue's
  # timeout and be removed. `hold` reads PR labels, which a merge group does not
  # carry, so it passes there; the brake still works on the PR itself, which cannot
  # enter the queue while it is red.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Pinned tool versions.
  CARGO_LLVM_COV_VERSION: "0.8.7"
  CARGO_MACHETE_VERSION: "0.9.2"
  # The quality report's own tools (scripts/quality.sh; jscpd and ESLint are pinned in
  # scripts/quality/package-lock.json).
  RUST_CODE_ANALYSIS_VERSION: "0.0.25"
  CARGO_DENY_VERSION: "0.20.2"
  RIPSECRETS_VERSION: "0.1.11"
  # The vendored cedar-solve's runtime is pinned by hash in scripts/ci/cedar-requirements.txt.

jobs:
  detect:
    name: detect
    runs-on: ubuntu-latest
    outputs:
      has_code: ${{ steps.check.outputs.has_code }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - id: check
        run: |
          if [ -f Cargo.toml ]; then
            echo "has_code=true" >> "$GITHUB_OUTPUT"
            echo "Cargo workspace detected — cargo gates ACTIVE"
          else
            echo "has_code=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No root Cargo.toml yet (spec-only branch) — cargo gates skip until the first crate lands"
          fi
      - uses: ./.github/actions/attest
        continue-on-error: true
        with:
          gate: detect
          proves: "whether a root Cargo.toml exists, which is what arms every cargo gate below"
          measured: "has_code=${{ steps.check.outputs.has_code }}"

  fmt:
    name: rustfmt
    needs: detect
    if: needs.detect.outputs.has_code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with: { components: rustfmt }
      - run: cargo fmt --all --check
      - uses: ./.github/actions/attest
        continue-on-error: true
        with:
          gate: rustfmt
          proves: "every file in the workspace is byte-identical to its rustfmt output"
          measured: "0 files deviate"

  clippy:
    name: clippy
    needs: detect
    if: needs.detect.outputs.has_code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - uses: ./.github/actions/attest
        continue-on-error: true
        with:
          gate: clippy
          proves: "clippy raises zero lints across the whole workspace, all targets and all features, with warnings denied"
          measured: "0 lints"

  # Runs only when started by hand (Actions > CI > Run workflow), since 2026-11-14. It
  # ran the whole workspace suite a second time, instrumented, and took 32 to 55 minutes
  # a run, so it set the pace of every PR and every merge-queue entry. The `test` gate
  # (ergane-gates.yml) runs a superset of the same tests on every PR. It is no longer a
  # required check; its 80% floor and reports are still here for a manual run.
  test-coverage:
    name: test-coverage
    needs: detect
    if: github.event_name == 'workflow_dispatch' && needs.detect.outputs.has_code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with: { components: llvm-tools-preview }
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo install cargo-llvm-cov --version "$CARGO_LLVM_COV_VERSION" --locked
      - name: Tests + coverage gate (80% workspace line-coverage floor)
        id: cov
        run: |
          set -uo pipefail
          cargo llvm-cov --workspace --locked --all-features \
            --fail-under-lines 80 --lcov --output-path lcov.info || exit 1
          # KEEP THE NUMBER. The gate asserts >=80 and, with --lcov, prints nothing a human or
          # an audit can read — so "passed" was the only surviving fact and 80.1% was
          # indistinguishable from 100%. `report` re-renders the profdata the run just produced;
          # it re-runs no tests. Never let it fail the gate: the coverage FLOOR is the gate, this
          # is only the evidence.
          pct="$(cargo llvm-cov report --summary-only --json 2>/dev/null \
                 | jq -r '.data[0].totals.lines.percent // empty' 2>/dev/null || true)"
          [ -n "$pct" ] && pct="$(printf '%.2f' "$pct")"
          echo "pct=${pct:-unknown}" >> "$GITHUB_OUTPUT"
          echo "line coverage: ${pct:-unknown}% (floor 80%)"
      # The report a human reads: the profdata the gate just measured, re-rendered as HTML,
      # lcov and a per-crate table (docs/coverage.md). It re-runs no tests. It also runs when
      # the floor fails, because that is when the table is wanted. Evidence only: it never
      # fails the gate.
      - name: Coverage report (HTML, lcov, per crate)
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          COVERAGE_DIR: ${{ runner.temp }}/coverage # outside target/, which rust-cache saves
        run: |
          bash scripts/coverage.sh --rust --report-only
          cat "$COVERAGE_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the coverage report
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-rust
          path: ${{ runner.temp }}/coverage
          retention-days: 30
          if-no-files-found: warn
      - name: Doctests (coverage tool excludes them)
        run: cargo test --workspace --locked --doc
      - uses: ./.github/actions/attest
        continue-on-error: true
        with:
          gate: test-coverage
          proves: "workspace line coverage is at or above the 80% floor; all tests and doctests pass under --locked"
          measured: "${{ steps.cov.outputs.pct }}% lines (floor 80%)"

  # End-to-end eval. Every gate above asks whether the code is GOOD. None asks whether
  # it WORKS — and on 2026-10-17 main (a275521), merged through all of them, solved 0 of
  # the 21 reference images cedar solves 19 of (docs/audit-e2e-parity.md). 156 tests at
  # 80%+ coverage ran against empty databases and symmetric coordinates: tests that
  # could not fail.
  #
  # Parity with cedar is the product's correctness definition (ENVIRONMENT.md), so it
  # blocks every PR. Three tiers, each anchored to the independent oracle, on the
  # product's real entry points, with the real database: E1 centroid parity · E2 image
  # entry point · E3 gRPC service. Release build on purpose: these are the numbers a
  # user gets. Armed unless vars.E2E_ARMED disarms it with an expiry date
  # (scripts/ci/e2e-eval.sh, which also checks the test targets it runs).
  #
  # Deliberately NOT gated on detect.has_code: a skipped required check counts as
  # passed, so a PR that removed the root Cargo.toml would skip its way to green. The
  # script decides instead and fails when there is no workspace.
  # The attestation runs on failure too: a red e2e run's numbers are the finding.
  e2e-eval:
    name: e2e-eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with: { shared-key: e2e-release }
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with: { python-version: "3.12" }
      # A golden is only as good as its provenance. Re-derive every one from the vendored
      # cedar before trusting any of them, and check that the inputs they were derived
      # from are the ones a human approved (cedar-goldens.py pins their hash and count).
      - name: Oracle integrity — every golden reproduces from the vendored cedar
        id: oracle
        run: |
          python -m pip install --quiet --only-binary=:all: --require-hashes \
            -r scripts/ci/cedar-requirements.txt
          python scripts/ci/cedar-goldens.py --check
      - name: End-to-end eval against the cedar oracle (E1 centroids · E2 pixels · E3 gRPC)
        id: eval
        env:
          E2E_REPORT_DIR: ${{ runner.temp }}/e2e
          E2E_ARMED: ${{ vars.E2E_ARMED }}
        run: bash scripts/ci/e2e-eval.sh
      - name: Keep the scorecards
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-scorecard
          path: ${{ runner.temp }}/e2e
          retention-days: 90
          if-no-files-found: warn
      - uses: ./.github/actions/attest
        if: always()
        continue-on-error: true
        with:
          gate: e2e-eval
          proves: "the product solves the 21 reference images the way the independent oracle (cedar) does — from centroids, with and without an FOV estimate (E1: same status, identical matched stars, within 5 arcsec), from pixels via solve_from_image (E2: within 10 arcsec, identical to the composed path) and over gRPC with the real database (E3) — that every tier ran from its owned test file and left the tree untouched, and that every golden it compared against reproduces from the vendored cedar"
          measured: "${{ steps.oracle.outputs.reproduced }} · ${{ steps.eval.outputs.measured }}"

  # The e2e gate's own proof: a gate that cannot fail is decoration. Two families, one mutant at
  # a time, each required to turn the e2e tier that owns it red: bugs the audit found
  # on main, re-injected; and probes that nudge one golden just past one tolerance (or
  # drop one star ID), so loosening any tolerance or deleting any check lets a probe
  # survive. Anchors fail closed (scripts/ci/e2e-canary.sh). Not gated on detect, for
  # the same reason as e2e-eval.
  e2e-canary:
    name: e2e-canary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with: { shared-key: e2e-release }
      - name: Probe every e2e check and re-inject audited bugs; each must turn its tier red
        id: canary
        env:
          E2E_ARMED: ${{ vars.E2E_ARMED }}
          E2E_CANARY_WORK: ${{ runner.temp }}/e2e-canary
        run: bash scripts/ci/e2e-canary.sh
      - name: Keep the canary's evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-canary
          path: ${{ runner.temp }}/e2e-canary
          retention-days: 90
          if-no-files-found: warn
      - uses: ./.github/actions/attest
        if: always()
        continue-on-error: true
        with:
          gate: e2e-canary
          proves: "e2e-eval is not vacuous: ten probes (one golden nudged past one tolerance, or one star ID dropped) and five bugs re-injected from main (docs/audit-e2e-parity.md: S1 twice, S2, G1, S5), each applied alone, turn the e2e tier that owns them red with a recorded failure, and the unmutated tree is green"
          measured: "${{ steps.canary.outputs.measured }}"

  # The finder console's page (crates/finder/web). The binary embeds the committed build
  # (dist/), so a source change with a stale build ships the old page: rebuild and compare.
  # Then the real thing: the release binary with the real database and samples, driven in
  # Chromium (the phone's first screen, night mode's red-only pixels, offline use, the
  # solve paths). The night check carries its own control, so it cannot pass vacuously.
  finder-page:
    name: finder-page
    needs: detect
    if: needs.detect.outputs.has_code == 'true'
    # Playwright 1.56.1 can't install Chromium on ubuntu-latest (26.04); see #196.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: crates/finder/web
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crates/finder/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run format:check
      - name: Unit and component tests
        id: unit
        env:
          NO_COLOR: "1" # Vitest colours its summary on CI; the count below is read from it
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/vitest.log"
          echo "tests=$(grep -oE 'Tests +[0-9]+ passed' "$RUNNER_TEMP/vitest.log" | grep -oE '[0-9]+')" >> "$GITHUB_OUTPUT"
      # The same unit tests again with v8 coverage, as a report to read (docs/coverage.md).
      # A few seconds. Evidence only: no threshold, and it never fails this check.
      - name: Unit-test coverage report
        continue-on-error: true
        working-directory: .
        env:
          COVERAGE_DIR: ${{ runner.temp }}/coverage
        run: |
          bash scripts/coverage.sh --web
          cat "$COVERAGE_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the page's coverage report
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-page
          path: ${{ runner.temp }}/coverage
          retention-days: 30
          if-no-files-found: warn
      - name: The committed build is the build of this source
        run: |
          npm run build
          if [ -n "$(git status --porcelain -- dist)" ]; then
            git status --short -- dist
            echo "::error::crates/finder/web/dist is stale: run npm run build there and commit dist/"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with: { shared-key: finder-page }
      - run: npx playwright install --with-deps chromium
      - name: End to end in Chromium against the release binary
        id: e2e
        run: |
          set -o pipefail
          npm run e2e 2>&1 | tee "$RUNNER_TEMP/e2e.log"
          echo "tests=$(grep -oE '[0-9]+ passed' "$RUNNER_TEMP/e2e.log" | tail -1 | grep -oE '[0-9]+')" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/attest
        if: always()
        continue-on-error: true
        with:
          gate: finder-page
          proves: "the finder page typechecks and is Prettier-clean, its unit and component tests pass, the committed dist/ is exactly the build of this source, and in Chromium against the release binary the phone's first screen holds the pointing card, roster, chart and legend, night mode leaves no pixel off the red channel or brighter than the night ink (with a day control), and nothing loads from another host until the survey is asked for"
          measured: "${{ steps.unit.outputs.tests }} unit/component tests, ${{ steps.e2e.outputs.tests }} end-to-end tests"

  docs:
    name: docs
    needs: detect
    if: needs.detect.outputs.has_code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --all-features
      - uses: ./.github/actions/attest
        continue-on-error: true
        with:
          gate: docs
          proves: "rustdoc builds the whole workspace with zero warnings (broken intra-doc links included)"
          measured: "0 rustdoc warnings"

  msrv:
    name: msrv
    needs: detect
    if: needs.detect.outputs.has_code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      # Keep in sync with rust-version in Cargo.toml (single source of truth).
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with: { toolchain: "1.96.0" }
      - run: cargo build --workspace --locked
      - uses: ./.github/actions/attest
        continue-on-error: true
        with:
          gate: msrv
          proves: "the workspace still builds on the oldest Rust we claim to support, so no dependency or syntax has silently raised the floor"
          measured: "builds on 1.96.0 (the declared MSRV)"

  unused-deps:
    name: cargo-machete
    needs: detect
    if: needs.detect.outputs.has_code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - run: cargo install cargo-machete --version "$CARGO_MACHETE_VERSION" --locked
      - run: cargo machete
      - uses: ./.github/actions/attest
        continue-on-error: true
        with:
          gate: cargo-machete
          proves: "every dependency declared in a Cargo.toml is actually used by the crate that declares it"
          measured: "0 unused dependencies (cargo-machete ${{ env.CARGO_MACHETE_VERSION }})"

  deny:
    name: cargo-deny
    needs: detect
    if: needs.detect.outputs.has_code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
        with:
          command: check advisories bans sources licenses
      - uses: ./.github/actions/attest
        continue-on-error: true
        with:
          gate: cargo-deny
          proves: "no dependency carries a known security advisory, a banned crate, an unvetted source registry, or a disallowed licence"
          measured: "0 findings across advisories, bans, sources, licenses"

  # The code-quality report (docs/quality.md): complexity, duplication, size, clippy's
  # pedantic and nursery lints, panic paths, `unsafe` and advisories, graded A to E per crate,
  # as HTML in the quality-report artifact and a table in the job summary. Evidence only,
  # like the coverage report: not a required check, no threshold, and every step is
  # continue-on-error, so it cannot turn red. The merge queue skips it; nothing reads it there.
  quality:
    name: quality-report
    needs: detect
    if: needs.detect.outputs.has_code == 'true' && github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install protoc
        continue-on-error: true
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        continue-on-error: true
        with: { components: clippy }
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        continue-on-error: true
        with: { shared-key: quality } # also keeps the tools below in ~/.cargo/bin
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        continue-on-error: true
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: scripts/quality/package-lock.json
      - name: Install the report's tools
        continue-on-error: true
        run: |
          cargo install rust-code-analysis-cli --version "$RUST_CODE_ANALYSIS_VERSION" --locked
          cargo install cargo-deny --version "$CARGO_DENY_VERSION" --locked
          cargo install cargo-machete --version "$CARGO_MACHETE_VERSION" --locked
      # The workflow's RUSTFLAGS="-D warnings" stays: quality.sh caps clippy's lints at warn.
      - name: Quality report (HTML, JSON, per crate)
        continue-on-error: true
        env:
          QUALITY_DIR: ${{ runner.temp }}/quality
        run: |
          bash scripts/quality.sh
          cat "$QUALITY_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the quality report
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-report
          path: ${{ runner.temp }}/quality
          retention-days: 30
          if-no-files-found: warn

  # cargo-semver-checks intentionally ABSENT until the first tagged release
  # exists as a baseline — an unfailable job would be a fake gate.

  secrets:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - run: cargo install ripsecrets --version "$RIPSECRETS_VERSION" --locked
      - run: ripsecrets .
      - uses: ./.github/actions/attest
        continue-on-error: true
        with:
          gate: secret-scan
          proves: "no committed file in the full history contains anything ripsecrets recognises as a credential"
          measured: "0 secrets (ripsecrets ${{ env.RIPSECRETS_VERSION }}, full history, fetch-depth 0)"

  # A manual brake. On 2026-07-12 a human converted a PR to DRAFT to stop it while its
  # contents were in question; an agent marked it ready_for_review 2m26s later and it
  # merged 7 seconds after that. Draft status and labels are requests an automated
  # participant can clear. A REQUIRED CHECK that is RED while the hold is on is not:
  # GitHub refuses the merge.
  #
  # The job is inert without the `hold:human` label, so it is green on every PR nobody
  # has parked, and a human can park any PR by adding the label.
  hold:
    name: hold
    runs-on: ubuntu-latest
    steps:
      # Checkout is here only so the attest action below can be resolved from the repo.
      # The hold assertion itself reads the label from the event payload and needs no code.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Fail while an operator has parked this PR
        if: contains(github.event.pull_request.labels.*.name, 'hold:human')
        run: |
          echo "::error::hold:human — this PR is parked. Merging is blocked."
          echo
          echo "If you are an agent: do NOT remove the label, and do NOT mark this PR ready"
          echo "for review. Leave it parked and say so."
          echo
          echo "To release it, a human removes the hold:human label. The workflow re-runs on"
          echo "'unlabeled' and this check turns green."
          exit 1
      - run: echo "No operator hold. Proceeding."
      - uses: ./.github/actions/attest
        continue-on-error: true
        with:
          gate: hold
          proves: "no operator has parked this PR — green here means the hold:human label was ABSENT, not that anyone approved"
          measured: "hold:human absent"
