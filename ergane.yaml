# What "green" means for this repository. Every agent node dispatched here reads
# this file to learn which commands decide its fate. Declared, never auto-detected.
#
# Schema v2: `ladder:` and `roadmap:` are v2-only keys. The worker's installed
# parser reads this file, not the worktree's, so a node must never add a key here;
# the operator declares, nodes obey.
version: 2

runtime: bwrap

# Two gates. Schema v1 fixes the legal names to `test`, `lint` and `typecheck`;
# clippy type-checks every target, so a separate `typecheck` would only compile the
# workspace a second time.
#
# These are the fast local half of the contract. The merge queue also runs every
# required `ci.yml` job (the 12 checks branch protection requires: the cedar e2e
# eval and canary, finder-page, msrv, docs, deny, machete, secrets; the coverage
# floor runs only by hand since 2026-11-14),
# so a node can pass here and still be refused at the queue. The commands below are
# the ones `ci.yml` runs, with the same `-D warnings`, so the two halves agree on
# everything they both check. `.github/workflows/ergane-gates.yml` runs these same
# commands under the job names `lint` and `test`; keep the two files in lockstep.
#
# `cargo` is not on the boundary's PATH: the gate boundary binds only uv, node,
# git, the agent runner and /usr, under a tmpfs HOME. The toolchain arrives through
# the CARGO_HOME / RUSTUP_HOME caches below, so each command puts $CARGO_HOME/bin
# on PATH first.
#
# The C toolchain is named explicitly. On Debian/Ubuntu `/usr/bin/cc` and
# `/usr/bin/c++` are links through `/etc/alternatives/`, which the boundary does
# not mount, so inside it they dangle and every build script fails with "linker
# `cc` not found". `gcc` and `g++` resolve within `/usr`. CC/CXX reach the cc crate
# (zstd-sys compiles C); the LINKER variable reaches rustc. Neither changes what is
# compiled, so CI, which uses the runner's own `cc`, checks the same thing.
#
# Naming `gcc` costs rustc its default linker. rustc reads the linker flavor from
# the name it is given, so an explicit `gcc` drops the bundled `rust-lld` and links
# with GNU ld, which is single-threaded and slow enough that a cold `test` piles up
# one link per test binary. On 2026-11-02, 31 of them held about 15 GB and the
# host OOM-killed an unrelated app. The two `link-arg`s hand gcc the toolchain's
# own lld back, as rustc does when it picks the linker itself. On a cold
# `cargo test --no-run -j16`, GNU ld peaked at 13 links and 6.3 GiB; lld at 4 and
# 2.7 GiB. RUSTFLAGS is exported after PATH because `$(rustc ...)` expands before
# `export` assigns anything. Link arguments change how binaries are linked, not
# what is compiled, so `-D warnings` is still the flag CI and the gates share.
#
# `lint` also builds the docs with warnings denied, the command `ci.yml`'s `docs`
# job runs. The judge sees gate results and the diff, nothing else, so a story
# whose scenario says the docs build has no evidence for it unless a gate ran it.
# The judge also reads that literally: a scenario that names a command is proven
# only by that exact command, not a broader one. So `lint` runs the per-crate form
# spec 012 names as well as the workspace build; write new scenarios to name a
# command that is already here.
#
# `test` also runs `ci.yml`'s `finder-page` checks, in the same order and from
# the same directory: `npm ci`, typecheck, the Prettier check, the Vitest suite,
# the build-freshness check (a fresh `npm run build` leaves `dist/` exactly as
# committed), and the Playwright suite against the release binary. Without them a
# page story's Vitest and Playwright scenarios had no gate evidence at all.
# Playwright runs with CI=1, as in CI, so it starts its own servers rather than
# reusing whatever already listens on 8097, and the release build reuses the
# worktree's own target directory.
#
# Each command builds into the worktree's own `target/`. A target directory
# shared between worktrees let one story's gate run another story's test binary:
# cargo hashes workspace crates by their path relative to the workspace, so two
# worktrees of this repository write the same artifact names, and a build from
# the other worktree that was newer than this one's sources looked fresh.
# (Epic-012's US4 ran US6's finder tests that way on 2026-10-31.)
gates:
  lint: >-
    export PATH="$CARGO_HOME/bin:$PATH" CARGO_TARGET_DIR="$PWD/target"
    CC=gcc CXX=g++ CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=gcc &&
    export RUSTFLAGS="-D warnings -C link-arg=-fuse-ld=lld
    -C link-arg=-B$(rustc --print sysroot)/lib/rustlib/x86_64-unknown-linux-gnu/bin/gcc-ld" &&
    cargo fmt --all --check &&
    cargo clippy --workspace --all-targets --all-features --locked -- -D warnings &&
    RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --all-features --locked &&
    RUSTDOCFLAGS="-D warnings" cargo doc -p finder --no-deps
  test: >-
    export PATH="$CARGO_HOME/bin:$PATH" CARGO_TARGET_DIR="$PWD/target"
    CC=gcc CXX=g++ CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=gcc &&
    export RUSTFLAGS="-D warnings -C link-arg=-fuse-ld=lld
    -C link-arg=-B$(rustc --print sysroot)/lib/rustlib/x86_64-unknown-linux-gnu/bin/gcc-ld" &&
    cargo test --workspace --all-targets --all-features --locked &&
    cargo test --workspace --locked --doc &&
    cd crates/finder/web &&
    npm ci --no-audit --no-fund &&
    npm run typecheck &&
    npm run format:check &&
    npm test &&
    npm run build &&
    git status --porcelain -- dist | (! grep .) &&
    CI=1 npm run e2e

# A warm `test` runs in a few minutes. The first gate in a fresh worktree compiles
# tonic, prost and image from scratch, twice: once for the debug tests and once
# for the release binary Playwright serves. Leave headroom rather than charge a
# cold build to a node's attempt budget.
timeouts:
  lint: 1200
  test: 3600

# Writable binds into the gate boundary, each paired with the variable that
# points the toolchain at it.
#
# The toolchain is a dedicated rustup install for the factory, not the operator's
# ~/.cargo and ~/.rustup. Gate commands run agent-written build scripts and
# tests, and every bind here is writable; a node must not be able to replace a
# binary the operator later runs. It tracks stable, as ci.yml's
# dtolnay/rust-toolchain does, so local clippy sees the lints CI will.
# Provision or update it with:
#
#     CARGO_HOME=~/.cache/ergane/rust/cargo RUSTUP_HOME=~/.cache/ergane/rust/rustup \
#       ~/.cache/ergane/rust/cargo/bin/rustup update stable
#
# There is deliberately no shared CARGO_TARGET_DIR (see the gates above): agents
# and gates both build into the worktree's own `target/`, at the cost of one cold
# build per story. The npm cache and the Playwright browsers are shared because
# they are keyed by content (package integrity hashes, browser revision), not by
# path. The gate does not install browsers: `playwright install` refuses this
# host's Ubuntu release, so the operator seeds the revision the lockfile's
# Playwright pins (1.56.1 -> chromium 1194, with its headless shell and ffmpeg
# 1011). A story that changes the Playwright version fails e2e until the operator
# seeds the new revision. Seed with:
#
#     PLAYWRIGHT_HOST_PLATFORM_OVERRIDE=ubuntu24.04-x64 \
#     PLAYWRIGHT_BROWSERS_PATH=~/.cache/ergane/ms-playwright/plate-solver \
#       npx --prefix crates/finder/web playwright install chromium
#
# If that hangs at "extracting archive" (Playwright 1.56's extractor under Node
# 24), fetch chromium-linux.zip and chromium-headless-shell-linux.zip from
# cdn.playwright.dev/dbazure/download/playwright/builds/chromium/<rev>/, unzip them
# into chromium-<rev>/ and chromium_headless_shell-<rev>/, and touch
# INSTALLATION_COMPLETE and DEPENDENCIES_VALIDATED in each.
caches:
  - path: ~/.cache/ergane/rust/cargo
    env: CARGO_HOME
  - path: ~/.cache/ergane/rust/rustup
    env: RUSTUP_HOME
  - path: ~/.cache/ergane/npm/plate-solver
    env: npm_config_cache
  - path: ~/.cache/ergane/ms-playwright/plate-solver
    env: PLAYWRIGHT_BROWSERS_PATH

# Story-sized Rust diffs carry tests and goldens beside the code. The 64 KiB
# default refuses them after the gates have passed; this keeps a ceiling while
# matching what the other targets on this host declare.
diff_refusal_bytes: 262144

# The document every agent attempt is told to read and obey.
standards: .specify/memory/constitution.md

# The branch the factory lands on. Declared by the operator, never by a node.
landing_branch: main

# The retry ladder, mirroring ergane's own manifest:
#
#     implementer x2  ->  closer x1 (promotion)  ->  debugger x1  ->  escalate
#
# `promotion_persona` names a ROLE, never a model: model names live in the
# operator's personas.yaml alone.
ladder:
  max_attempts: 2
  promotion_cycles: 1
  promotion_persona: closer

# How wide the floor may run. Every spec carries `depends_on_landed` in its
# frontmatter, so a second concurrent epic never starts N+1 before N has landed.
roadmap:
  cadence_s: 300
  max_concurrent_epics: 2
  max_concurrent_nodes: 2
