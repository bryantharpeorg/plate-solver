syntax = "proto3";

package scope_node.v1;

// Internal scope link. Every call requires the session's bearer token.
service ScopeNode {
  rpc Describe(DescribeRequest) returns (CameraInfo);
  rpc Frames(FramesRequest) returns (stream StarFrame);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatReply);
  // Returns the settings in force.
  rpc Configure(Settings) returns (Settings);
  // Asks for a preview on the next star frame.
  rpc RequestPreview(PreviewRequest) returns (PreviewAck);
}

message DescribeRequest {}
message FramesRequest {}
message PreviewRequest {}
message PreviewAck {}

message Mode {
  uint32 width = 1;
  uint32 height = 2;
  double fps = 3;
}

message CameraInfo {
  string model = 1;
  uint32 width = 2;
  uint32 height = 3;
  repeated Mode modes = 4;
  Mode active_mode = 5;
  double exposure_min_ms = 6;
  double exposure_max_ms = 7;
  double gain_min = 8;
  double gain_max = 9;
}

message Settings {
  // Absent exposure or gain means automatic control.
  optional double exposure_ms = 1;
  optional double gain = 2;
  Detection detection = 3;
}

message Detection {
  double sigma = 1;
  uint32 binning = 2;
  bool normalize_rows = 3;
  bool detect_hot_pixels = 4;
}

message StarFrame {
  uint64 id = 1;
  // Exposure start and end in seconds on the node's monotonic clock.
  double start_s = 2;
  double end_s = 3;
  uint32 width = 4;
  uint32 height = 5;
  // Actual exposure and gain used, including when automatically controlled.
  double exposure_ms = 6;
  double gain = 7;
  Settings settings = 8;
  // At most 200 centroids, brightest first, in full-frame pixels.
  repeated Centroid centroids = 9;
  optional bytes preview_jpeg = 10;
  // Both axes' counts sampled at exposure start and end on the node.
  AxisPositions axis_start = 11;
  AxisPositions axis_end = 12;
}

message Centroid {
  double x = 1;
  double y = 2;
  double brightness = 3;
}

message HeartbeatRequest {
  // Console send time, in seconds on the console's clock.
  double t0 = 1;
}

message HeartbeatReply {
  // Echoed console send time; the console records receive time t3 locally.
  double t0 = 1;
  // Node receive and reply times on the same clock as exposure times.
  double t1 = 2;
  double t2 = 3;
}

// Mount port. Every call requires the session's bearer token.
service ScopeNodeMount {
  rpc DescribeMount(DescribeMountRequest) returns (DescribeMountReply);
  rpc AxisState(AxisStateRequest) returns (.scope_node.v1.AxisState);
  rpc GotoAxis(GotoAxisRequest) returns (GotoAxisReply);
  rpc RateAxis(RateAxisRequest) returns (RateAxisReply);
}

// Anyone can stop the telescope, including an unpaired console.
service ScopeNodeStop {
  rpc StopAll(StopAllRequest) returns (StopAllReply);
}

enum Axis {
  AXIS_UNSPECIFIED = 0;
  AXIS_AZIMUTH = 1;
  AXIS_ALTITUDE = 2;
}
message AxisInfo {
  uint32 counts_per_revolution = 1;
  double top_rate_deg_per_s = 2;
  bool can_goto = 3;
}
message AxisState {
  int32 position = 1;
  double rate_deg_per_s = 2;
  bool moving = 3;
  // Times the node's watchdog has stopped the mount since the node started.
  uint64 watchdog_stops = 4;
  // Resets of the motor board the node has seen since it started.
  uint64 mount_resets = 5;
}
message AxisPositions {
  int32 azimuth = 1;
  int32 altitude = 2;
}
message DescribeMountRequest {}
message DescribeMountReply {
  // Azimuth first, altitude second; empty when no mount is connected.
  repeated AxisInfo axes = 1;
  // Firmware as major.minor and board code, empty when unknown.
  string firmware = 2;
  string board = 3;
}
message AxisStateRequest { Axis axis = 1; }
message GotoAxisRequest {
  Axis axis = 1;
  int32 position = 2;
}
message GotoAxisReply {}
message RateAxisRequest {
  Axis axis = 1;
  double deg_per_s = 2;
}
message RateAxisReply {}
message StopAllRequest {}
message StopAllReply {}

// Raw frames on request (025). Every call requires the session's bearer token.
// A node built before 025 lacks this service and answers UNIMPLEMENTED.
service ScopeNodeRaw {
  // Waits for the next star frame the node sends and answers with its pixels.
  rpc RawFrame(RawFrameRequest) returns (RawFrameReply);
}
message RawFrameRequest {}
message RawFrameReply {
  // The star frame these pixels were detected on.
  uint64 id = 1;
  uint32 width = 2;
  uint32 height = 3;
  // 8-bit gray, row-major, width × height bytes, no padding.
  bytes pixels = 4;
}

// The imaging camera (030). Every call requires the session's bearer token.
// A node built before 030 lacks this service and answers UNIMPLEMENTED; a node with
// no imaging camera answers FAILED_PRECONDITION to every call.
service ScopeNodeImaging {
  rpc DescribeImaging(DescribeImagingRequest) returns (ImagingInfo);
  rpc ImagingStatus(ImagingStatusRequest) returns (ImagingStatusReply);
  // An absent field leaves that setting alone. Returns the settings in force.
  rpc ConfigureImaging(ImagingSettings) returns (ImagingSettings);
  // One exposure: one header, then its samples in chunks of at most 262144 bytes.
  rpc Expose(ExposeRequest) returns (stream ExposeEvent);
  rpc AbortExposure(AbortExposureRequest) returns (AbortExposureReply);
}
message DescribeImagingRequest {}
message ImagingStatusRequest {}
message AbortExposureRequest {}
message AbortExposureReply {}
message ImagingRange {
  double min = 1;
  double max = 2;
}
message ImagingInfo {
  string model = 1;
  optional string serial = 2;
  // Unbinned sensor pixels.
  uint32 width = 3;
  uint32 height = 4;
  double pixel_um = 5;
  // Bits a sample as delivered: 8 or 16.
  uint32 bits = 6;
  // "RGGB", "BGGR", "GRBG" or "GBRG"; empty for a mono sensor.
  string bayer = 7;
  ImagingRange exposure_ms = 8;
  // Absent when the camera has no such control.
  ImagingRange gain = 9;
  ImagingRange offset = 10;
  repeated uint32 binnings = 11;
  bool cooler = 12;
}
message ImagingRoi {
  uint32 x = 1;
  uint32 y = 2;
  uint32 width = 3;
  uint32 height = 4;
}
message ImagingSettings {
  optional double gain = 1;
  optional double offset = 2;
  optional uint32 binning = 3;
  ImagingRoi roi = 4;
  optional bool cooler_on = 5;
  optional double set_temp_c = 6;
}
message ImagingStatusReply {
  optional double temp_c = 1;
  // Percent.
  optional double cooler_power = 2;
  optional double set_temp_c = 3;
  bool exposing = 4;
}
message ExposeRequest {
  double exposure_ms = 1;
  // 1 to 16 lower-case letters; "dark" and "flat" choose the camera's frame type.
  string purpose = 2;
  // Forward at most this many bytes of samples a second; 0 means no limit.
  uint32 max_bytes_per_s = 3;
  // Also keep the frame on the node's disk.
  bool save = 4;
}
message ExposeEvent {
  oneof event {
    ImagingFrameHeader header = 1;
    bytes chunk = 2;
  }
}
message ImagingFrameHeader {
  // The node's count of imaging frames, from 1 for each run of the node.
  uint64 id = 1;
  uint32 width = 2;
  uint32 height = 3;
  uint32 bits = 4;
  string bayer = 5;
  // Exposure start and end in seconds on the node's monotonic clock.
  double start_s = 6;
  double end_s = 7;
  double exposure_ms = 8;
  optional double gain = 9;
  optional double offset = 10;
  uint32 binning = 11;
  optional double temp_c = 12;
  // Little-endian samples, row by row: width × height × bits / 8 bytes in all.
  uint64 byte_count = 13;
  string purpose = 14;
  // The node's own copy: its file name, or why there is none; both empty when not asked.
  string node_file = 15;
  string node_save_error = 16;
  // The region of interest in force for the exposure, in unbinned sensor pixels: the
  // frame's own `roi` (the plan document's Amendment 6).
  ImagingRoi roi = 17;
}
