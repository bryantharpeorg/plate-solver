# cargo-deny policy for the Tier-2 regime.
#
# Unlike the v1 stub (which deferred license policy), this curates a permissive
# license allow-list up front — a denied or unknown license is a hard failure, so
# a copyleft/unknown dependency cannot sneak in unnoticed.

[graph]
# Evaluate the platforms the standards target (Linux CI + Apple mobile builds).
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "aarch64-apple-darwin" },
]
all-features = true

[advisories]
# A yanked crate in the lockfile is a hard failure — replace it.
yanked = "deny"
# RUSTSEC IDs consciously accepted go here, each with a justification comment.
ignore = [
    # paste is unmaintained (RUSTSEC-2024-0436) and no safe upgrade is available.
    # It is only pulled in transitively by the `image` dev-dependency used by the
    # parity test in crates/star-detection; it is not part of the production
    # dependency graph.
    "RUSTSEC-2024-0436",
    # zip 0.6.6 — three advisories, all in archive EXTRACTION to the filesystem:
    # ZipArchive::extract / ZipStreamReader::extract keeping SUID/SGID bits
    # (RUSTSEC-2026-0367), creating symlinks whose targets escape the destination
    # (RUSTSEC-2026-0368), and applying permissions through symlinks
    # (RUSTSEC-2026-0369). Nothing in this workspace extracts an archive:
    # pattern-database reads .npz members into memory through npyz, and
    # database-generation only writes archives (zip::ZipWriter). zip 0.6 comes in
    # twice: through the `npz` feature of npyz 0.9.1 (the newest npyz, so no
    # `cargo update` clears it) and as database-generation's own `zip = "0.6.6"`.
    # Remove these once both are gone: the loader off npyz (the same change that
    # fixes its 1.2 GB peak, docs/audit-e2e-parity.md D2) and database-generation
    # on zip >= 9.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    # zip 0.6.6 again (RUSTSEC-2026-0429, published 2026-11-02): ZipArchive::extract
    # sizes a symlink target's buffer from the declared size and aborts on a huge
    # one. Also extraction only, so the reasoning above holds: npyz opens archives
    # with ZipArchive::new and reads members by name, and nothing calls extract.
    "RUSTSEC-2026-0429",
    # zstd-safe 5.0.2 (RUSTSEC-2026-0403): streaming decompression of a legacy zstd
    # frame that fails can expose uninitialized output memory. The fix is in
    # zstd-safe >= 8.2, which only zstd >= 0.14 uses, and zip 0.6 pins zstd 0.11.
    # Nothing here reads zstd data: zip would decompress zstd only for an archive
    # member stored with method 93, but numpy writes .npz members stored (0) or
    # deflated (8), database-generation writes them stored, and every .npz in this
    # repository is method 0 or 8. The databases are local files the owner made
    # or vendored, not untrusted input. It comes in through zip 0.6 like the three
    # above, so it goes when they do.
    "RUSTSEC-2026-0403",
]

[licenses]
# Permissive licenses only. Anything outside this set fails the gate and must be
# reviewed and added deliberately (or the dependency dropped).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "BSL-1.0",
    "CC0-1.0",
]
confidence-threshold = 0.9

[bans]
# Duplicate versions are a warning (transitive graphs drift); wildcards are banned
# because `foo = "*"` defeats the locked, reproducible-build guarantee.
multiple-versions = "warn"
wildcards = "deny"

[sources]
# Only crates.io and in-repo path deps. An unknown registry or git remote is a
# supply-chain red flag.
unknown-registry = "deny"
unknown-git = "deny"
